name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  build_and_preview:
    # Forks cannot mint an identity token for this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/614254960307/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cloudko.iam.gserviceaccount.com
      - run: npx firebase-tools@15 hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project cloudko --non-interactive | tee -a "$GITHUB_STEP_SUMMARY"
