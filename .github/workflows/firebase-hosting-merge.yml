name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/614254960307/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cloudko.iam.gserviceaccount.com
      - run: npx firebase-tools@15 deploy --only hosting --project cloudko --non-interactive
