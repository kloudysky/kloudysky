name: cloudko.dev
on:
  push:
    branches: [main]
    paths:
      - apps/cloudko/**
      - pnpm-lock.yaml
      - .github/workflows/cloudko.yml
  pull_request:
    paths:
      - apps/cloudko/**
      - pnpm-lock.yaml
      - .github/workflows/cloudko.yml
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    # Forks cannot mint an identity token for this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloudko
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter cloudko
      - run: pnpm build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/614254960307/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cloudko.iam.gserviceaccount.com
      - if: github.event_name == 'push'
        run: npx firebase-tools@15 deploy --only hosting --non-interactive
      - if: github.event_name == 'pull_request'
        run: npx firebase-tools@15 hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --non-interactive | tee -a "$GITHUB_STEP_SUMMARY"
